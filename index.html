<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>To Do List</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

:root {
  --bg:      #d6eeff;
  --light:   #e8f5ff;
  --mid:     #b7d9ff;
  --border:  #7ab8f5;
  --btn:     #9fcbff;
  --deep:    #4a90d9;
  --text:    #1a3a5c;
  --white:   #f0f8ff;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  background-color: var(--bg);
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 24px 24px;
  background-position: center center;
  font-family: 'Press Start 2P', monospace;
  image-rendering: pixelated;
}

body::after {
  content: '';
  pointer-events: none;
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(26,58,92,0.04) 3px,
    rgba(26,58,92,0.04) 4px
  );
  z-index: 999;
}

.popup {
  width: 100%;
  height: 100vh;
  background: var(--mid);
  border: 4px solid var(--text);
  padding: 0;
  box-shadow:
    4px 0   0 0 var(--text),
    0   4px 0 0 var(--text),
    8px 4px 0 0 var(--text),
    4px 8px 0 0 var(--text),
    8px 8px 0 0 var(--text),
    12px 12px 0 0 var(--deep);
  position: relative;
  animation: fadeIn 0.2s linear;
  display: flex;
  flex-direction: column;
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

.titlebar {
  height: 52px;

  background: linear-gradient(
    180deg,
    #c2e2ff 0%,
    #9ed0ff 30%,
    #7ab8f5 49%,
    #5ea6ed 50%,
    #4a90d9 75%,
    #3a7fc8 100%
  );

  border-bottom: 4px solid var(--text);

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 14px;

  position: relative;

  overflow: hidden;

  user-select: none;

  -webkit-app-region: drag;
}

.titlebar::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,.7),
    rgba(255,255,255,.0)
  );
}

.titlebar::after {
  content: '';
  position: absolute;
  top: 0; left: -60%;
  width: 40%; height: 100%;
  background: linear-gradient(
    105deg,
    transparent 40%,
    rgba(255,255,255,.12) 50%,
    transparent 60%
  );
  pointer-events: none;
}

.title-left {
  display: flex;
  align-items: center;
  gap: 10px;
  position: relative;
  z-index: 1;
}

.app-icon {
  width: 26px; height: 26px;
  background: linear-gradient(135deg, #f0f8ff 0%, #c2e2ff 100%);
  border: 3px solid rgba(255,255,255,.9);
  box-shadow:
    inset -2px -2px 0 #5ea6ed,
    inset  1px  1px 0 rgba(255,255,255,.8),
    2px 2px 0 rgba(0,0,0,.2);
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--deep);
  font-size: 11px;
}

.titlebar-title {
  color: white;
  font-size: 9px;
  text-shadow:
    1px 1px 0 rgba(0,0,0,.3),
    2px 2px 0 rgba(0,0,0,.15);
  letter-spacing: 2px;
}

.titlebar-dots-deco {
  flex: 1;
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 4px;
  position: relative;
  z-index: 1;
}

.titlebar-dots-deco span {
  display: block;
  width: 3px; height: 3px;
  background: rgba(255,255,255,.4);
  flex-shrink: 0;
}

.window-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  position: relative;
  z-index: 1;
  -webkit-app-region: no-drag;
}

.control-btn {
  width: 30px; height: 30px;
  border: 3px solid rgba(255,255,255,.85);
  background: linear-gradient(
    to bottom,
    #eaf6ff 0%,
    #c2e0ff 50%,
    #a0caff 100%
  );
  box-shadow:
    inset -2px -2px 0 #6aaee8,
    inset  1px  1px 0 rgba(255,255,255,.9),
    2px 2px 0 rgba(0,0,0,.18);
  color: var(--text);
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  cursor: pointer;
  display: flex;
  justify-content: center;
  align-items: center;
  transition: none;
  position: relative;
  -webkit-app-region: no-drag;
}

.control-btn:hover {
  background: linear-gradient(
    to bottom,
    #ffffff 0%,
    #dff1ff 100%
  );
  box-shadow:
    inset -1px -1px 0 #6aaee8,
    inset  1px  1px 0 rgba(255,255,255,.9),
    3px 3px 0 rgba(0,0,0,.2);
}

.control-btn:active {
  transform: translate(2px, 2px);
  box-shadow:
    inset 1px 1px 0 #6aaee8;
}

.minimize:hover {
  background: linear-gradient(to bottom, #fffde8 0%, #fff3a0 100%);
  color: #8a7000;
  box-shadow:
    inset -2px -2px 0 #d4b800,
    inset  1px  1px 0 rgba(255,255,255,.9),
    2px 2px 0 rgba(0,0,0,.15);
}

.close:hover {
  background: linear-gradient(to bottom, #ffe8ee 0%, #ff9ab8 100%);
  color: #7a0020;
  box-shadow:
    inset -2px -2px 0 #cc2255,
    inset  1px  1px 0 rgba(255,255,255,.9),
    2px 2px 0 rgba(0,0,0,.15);
}

.popup-body {
  padding: 20px;
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.header {
  text-align: center;
  margin-bottom: 22px;
  position: relative;
}

.header h2 {
  font-size: 20px;
  color: var(--text);
  text-transform: uppercase;
  letter-spacing: 3px;
  line-height: 1.5;
  text-shadow:
    3px 0 0 var(--deep),
    0 3px 0 var(--deep),
    3px 3px 0 var(--deep);
}

.header h2::after {
  content: '_';
  animation: blink 1s steps(1) infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0; }
}

.input-area {
  display: flex;
  gap: 0;
  margin-bottom: 18px;
  border: 4px solid var(--text);
  box-shadow: 3px 3px 0 var(--text);
}

.input-area input {
  flex: 1;
  padding: 10px 10px;
  border: none;
  background: var(--white);
  color: var(--text);
  outline: none;
  font-size: 8px;
  font-family: 'Press Start 2P', monospace;
  letter-spacing: 0.5px;
}

.input-area input::placeholder {
  color: var(--border);
  font-size: 7px;
}

.add-btn {
  width: 46px;
  border: none;
  border-left: 4px solid var(--text);
  background: var(--btn);
  color: var(--text);
  font-size: 20px;
  cursor: pointer;
  font-weight: bold;
  font-family: 'Press Start 2P', monospace;
  transition: none;
}

.add-btn:hover { background: var(--deep); color: var(--white); }
.add-btn:active { transform: translate(2px, 2px); }

.stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 12px;
  font-size: 7px;
  color: var(--text);
  padding: 6px 8px;
  background: var(--light);
  border: 3px solid var(--text);
  box-shadow: 2px 2px 0 var(--text);
}

ul {
  list-style: none;
  flex: 1;
  overflow-y: auto;
  padding-right: 0;
}

ul::-webkit-scrollbar { width: 8px; }
ul::-webkit-scrollbar-track { background: transparent; border: none; }
ul::-webkit-scrollbar-thumb { background: transparent; border: none; }

ul:hover::-webkit-scrollbar-track { background: var(--light); border: 2px solid var(--text); }
ul:hover::-webkit-scrollbar-thumb { background: var(--deep); border: 2px solid var(--text); }

li {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--light);
  border: 3px solid var(--text);
  padding: 10px 10px;
  margin-bottom: 10px;
  color: var(--text);
  box-shadow: 2px 2px 0 var(--text);
  animation: appear 0.15s steps(3) both;
  position: relative;
}

li::before {
  content: '';
  position: absolute;
  left: -3px; top: -3px; bottom: -3px;
  width: 5px;
  background: var(--border);
  border-right: 2px solid var(--text);
}

@keyframes appear {
  from { transform: translateX(-8px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

li span {
  flex: 1;
  word-break: break-word;
  font-size: 7px;
  line-height: 1.8;
  letter-spacing: 0.3px;
  margin-left: 4px;
}

input[type="checkbox"] {
  appearance: none;
  width: 20px; height: 20px;
  border: 3px solid var(--text);
  background: var(--white);
  cursor: pointer;
  position: relative;
  flex-shrink: 0;
  image-rendering: pixelated;
  transition: none;
}

input[type="checkbox"]:checked { background: var(--deep); }

input[type="checkbox"]:checked::after {
  content: "✓";
  position: absolute;
  top: -3px; left: 1px;
  color: white;
  font-size: 13px;
  font-weight: bold;
  font-family: 'Press Start 2P', monospace;
}

.completed span {
  text-decoration: line-through;
  opacity: 0.5;
  color: var(--deep);
}

.delete-btn {
  width: 26px; height: 26px;
  border: 3px solid var(--text);
  background: var(--btn);
  color: var(--text);
  cursor: pointer;
  font-size: 8px;
  font-family: 'Press Start 2P', monospace;
  flex-shrink: 0;
  box-shadow: 2px 2px 0 var(--text);
  transition: none;
}

.delete-btn:hover { background: var(--deep); color: var(--white); }
.delete-btn:active { transform: translate(2px, 2px); box-shadow: none; }

.empty-state {
  text-align: center;
  padding: 24px 10px;
  font-size: 7px;
  color: var(--deep);
  line-height: 2.2;
  display: none;
}

.empty-state .pixel-icon {
  display: block;
  margin: 0 auto 12px;
  animation: float 2s steps(4) infinite;
}

@keyframes float {
  0%,100% { transform: translateY(0); }
  50%      { transform: translateY(-6px); }
}

.footer {
  margin-top: 14px;
  text-align: center;
  font-size: 6px;
  color: var(--deep);
  letter-spacing: 1px;
  padding-top: 10px;
  border-top: 3px solid var(--border);
}
</style>
</head>

<body>

<div class="popup">

  <div class="titlebar">
    <div class="title-left">
      <div class="app-icon">✓</div>
      <span class="titlebar-title">TODO.exe</span>
    </div>
    <div class="titlebar-dots-deco">
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <div class="window-controls">
      <button class="control-btn minimize" id="minimizeBtn">—</button>
      <button class="control-btn close" id="closeBtn">✕</button>
    </div>
  </div>

  <div class="popup-body">

    <div class="header">
      <h2>TO DO LIST</h2>
    </div>

    <div class="input-area">
      <input type="text" id="taskInput" placeholder="nova tarefa..." />
      <button class="add-btn" id="addTask">+</button>
    </div>

    <div class="stats">
      <span>TAREFAS: <span id="totalCount">0</span></span>
      <span>FEITAS: <span id="doneCount">0</span></span>
      <span>★ XP: <span id="xpCount">0</span></span>
    </div>

    <ul id="taskList"></ul>

    <div class="empty-state" id="emptyState">
      <svg class="pixel-icon" width="20" height="20" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <polygon
          points="20,2 25,14 38,14 28,22 32,36 20,28 8,36 12,22 2,14 15,14"
          fill="#a8d4f5"
          stroke="#7ab8f5"
          stroke-width="2"
        />
      </svg>
      NENHUMA TAREFA...<br>ADICIONE UMA!
    </div>

    <div class="footer">
      INSERT COIN TO CONTINUE
    </div>

  </div>
</div>

<script>
  const { ipcRenderer } = require("electron");

  document.getElementById("closeBtn").addEventListener("click", () => {
    ipcRenderer.send("close-app");
  });

  document.getElementById("minimizeBtn").addEventListener("click", () => {
    ipcRenderer.send("minimize-app");
  });

  const addTaskBtn = document.getElementById("addTask");
  const taskInput  = document.getElementById("taskInput");
  const taskList   = document.getElementById("taskList");
  const totalCount = document.getElementById("totalCount");
  const doneCount  = document.getElementById("doneCount");
  const xpCount    = document.getElementById("xpCount");
  const emptyState = document.getElementById("emptyState");

  loadTasks();
  updateStats();

  addTaskBtn.addEventListener("click", addTask);
  taskInput.addEventListener("keypress", e => { if (e.key === "Enter") addTask(); });

  function addTask() {
    const text = taskInput.value.trim();
    if (text === "") return;
    createTask(text, false);
    saveTasks();
    taskInput.value = "";
    updateStats();
  }

  function createTask(text, completed) {
    const li = document.createElement("li");
    if (completed) li.classList.add("completed");

    li.innerHTML = `
      <input type="checkbox" ${completed ? "checked" : ""}>
      <span>${text}</span>
      <button class="delete-btn">✕</button>
    `;

    li.querySelector("input").addEventListener("change", () => {
      li.classList.toggle("completed");
      saveTasks();
      updateStats();
    });

    li.querySelector(".delete-btn").addEventListener("click", () => {
      li.style.animation = "none";
      li.style.opacity = "0";
      li.style.transform = "translateX(8px)";
      li.style.transition = "opacity 0.1s steps(3), transform 0.1s steps(3)";
      setTimeout(() => { li.remove(); saveTasks(); updateStats(); }, 120);
    });

    taskList.appendChild(li);
    updateEmpty();
  }

  function saveTasks() {
    const tasks = [];
    document.querySelectorAll("#taskList li").forEach(li => {
      tasks.push({
        text: li.querySelector("span").innerText,
        completed: li.classList.contains("completed")
      });
    });
    localStorage.setItem("tasks_blue", JSON.stringify(tasks));
  }

  function loadTasks() {
    const saved = JSON.parse(localStorage.getItem("tasks_blue")) || [];
    saved.forEach(t => createTask(t.text, t.completed));
  }

  function updateStats() {
    const items = document.querySelectorAll("#taskList li");
    const done  = document.querySelectorAll("#taskList li.completed");
    const xp    = done.length * 10;

    totalCount.textContent = items.length;
    doneCount.textContent  = done.length;
    xpCount.textContent    = xp;
    updateEmpty();
  }

  function updateEmpty() {
    const items = document.querySelectorAll("#taskList li");
    emptyState.style.display = items.length === 0 ? "block" : "none";
  }
</script>
</body>
</html>
